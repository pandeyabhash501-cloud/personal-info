<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .info-card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        .profile-pic {
            width: 100px;
            height: 100px;
            background-color: #ddd;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }
        h2 {
            margin: 10px 0;
            color: #333;
        }

        p {
            color: #666;
            margin: 5px 0;
            font-size: 14px;
        }

        .label {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="info-card">
        <h2>Student Profile</h2>
        <p><span class="label">Name:</span> Abhash Pandey</p>
        <p><span class="label">Age:</span> 19</p>
        <p><span class="label">Course:</span> Computer Science</p>
        <p><span class="label">Email:</span> pandeyabhash501@gmail.com</p>
        <p><span class="label">Phone:</span> +91 99056 37183</p>
        <button style="margin-top: 15px; padding: 8px 16px; cursor: pointer;">Contact Me</button>
    </div>

</body>
</html>
